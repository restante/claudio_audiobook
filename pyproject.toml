[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "claudio-audiobook"
version = "0.1.3"
description = "Turn text or a whole generated course into an audiobook with local Kokoro voices. MCP server for Claude Code and Claude Desktop."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{ name = "Claudio Restante" }]
keywords = ["audiobook", "tts", "kokoro", "mcp", "claude-code", "claude-desktop", "text-to-speech"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Multimedia :: Sound/Audio :: Speech",
]
dependencies = [
    "kokoro-onnx>=0.5.0",
    "numpy>=1.26",
    "mistune>=3.0.0",
    "psutil>=5.9",
    "imageio-ffmpeg>=0.5.1",
    "pillow>=10.1",  # generated cover art
    "mcp>=1.2.0,<2",  # v2 renames FastMCP; revisit when moving to it
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.8"]

[project.urls]
Homepage = "https://github.com/restante/claudio_audiobook"
Repository = "https://github.com/restante/claudio_audiobook"
Issues = "https://github.com/restante/claudio_audiobook/issues"
Changelog = "https://github.com/restante/claudio_audiobook/blob/main/CHANGELOG.md"

[project.scripts]
claudio-audiobook = "claudio_audiobook.cli:main"
claudio-audiobook-mcp = "claudio_audiobook.server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/claudio_audiobook"]

# An explicit allow-list: the sdist must never pick up local notes or settings.
[tool.hatch.build.targets.sdist]
include = ["src/claudio_audiobook", "tests", "README.md", "LICENSE", "CHANGELOG.md", "pyproject.toml"]

# Only affects how the repo's uv.lock is resolved (the lockfile must stay under the plugin directory's
# 256 KiB per-file limit); installing from PyPI with pip or uvx is unaffected.
[tool.uv]
environments = [
    "sys_platform == 'darwin' and python_version >= '3.12'",
    "sys_platform == 'win32' and python_version >= '3.12'",
    "sys_platform == 'linux' and python_version >= '3.12'",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
"src/claudio_audiobook/server.py" = ["E501"]  # tool descriptions are prose the model reads
"src/claudio_audiobook/guide.py" = ["E501"]  # prose
