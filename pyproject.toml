[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "claudio-audiobook"
version = "0.1.2"
description = "Turn text or a whole generated course into an audiobook with local Kokoro voices. MCP server for Claude Code and Claude Desktop."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{ name = "Claudio Restante" }]
keywords = ["audiobook", "tts", "kokoro", "mcp", "claude-code", "claude-desktop", "text-to-speech"]
dependencies = [
    "kokoro-onnx>=0.5.0",
    "numpy>=1.26",
    "mistune>=3.0.0",
    "psutil>=5.9",
    "imageio-ffmpeg>=0.5.1",
    "pillow>=10.1",  # generated cover art
    "mcp>=1.2.0,<2",  # v2 renames FastMCP; revisit when moving to it
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.8"]

[project.scripts]
claudio-audiobook = "claudio_audiobook.cli:main"
claudio-audiobook-mcp = "claudio_audiobook.server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/claudio_audiobook"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
"src/claudio_audiobook/server.py" = ["E501"]  # tool descriptions are prose the model reads
"src/claudio_audiobook/guide.py" = ["E501"]  # prose
